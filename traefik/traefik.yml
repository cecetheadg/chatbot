# ============================================
# Traefik Configuration - Production
# Chatbot L0027 - chatbot.dfgp.fonctionpublique.gov.gn
# ============================================

# Global configuration
global:
  checkNewVersion: false
  sendAnonymousUsage: false

# API and Dashboard configuration
api:
  dashboard: true
  insecure: false  # Dashboard accessible only through HTTPS

# Entrypoints configuration
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt

# Providers configuration
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: chatbot_l0027_network
    watch: true

  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

# Certificates configuration
certificatesResolvers:
  letsencrypt:
    acme:
      email: admin@laufane.com  # Change to your email
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web
      # For production, consider using DNS challenge instead:
      # dnsChallenge:
      #   provider: cloudflare  # or your DNS provider

# Logging configuration
log:
  level: INFO
  format: json
  filePath: /var/log/traefik/traefik.log

accessLog:
  filePath: /var/log/traefik/access.log
  format: json

# Metrics and tracing (optional)
# metrics:
#   prometheus:
#     addEntryPointsLabels: true
#     addServicesLabels: true

