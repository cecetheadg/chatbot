# ============================================
# Performance Configuration
# Optimized for 100,000+ users
# ============================================

# Application Settings
app:
  workers: 8  # Workers per instance (adjust based on CPU)
  max_workers: 32  # Maximum total workers across instances
  worker_timeout: 120  # Worker timeout in seconds
  keepalive: 2  # Keep-alive connections
  backlog: 2048  # Connection backlog
  
# Database Settings
database:
  pool_size: 50
  max_overflow: 100
  pool_recycle: 3600
  pool_timeout: 30
  echo: false  # Disable SQL logging in production
  
# Redis Settings
redis:
  max_connections: 100
  socket_timeout: 5
  socket_connect_timeout: 5
  retry_on_timeout: true
  
# Caching Strategy
cache:
  default_ttl: 3600  # 1 hour
  short_ttl: 300  # 5 minutes (frequent queries)
  long_ttl: 86400  # 24 hours (static content)
  
# Rate Limiting
rate_limit:
  per_minute: 300  # Requests per minute per IP
  burst: 50  # Burst allowance
  
# Logging
logging:
  level: INFO  # Production: INFO, Development: DEBUG
  format: json  # JSON for better parsing
  access_log: true
  rotation:
    max_bytes: 10485760  # 10MB
    backup_count: 5  # Keep 5 backups
    
# Monitoring
monitoring:
  enabled: true
  metrics_path: /metrics
  health_check_interval: 30

